name: Run Update Paper Links Weekly

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robotics-arxiv-update
  cancel-in-progress: false

env:
  GITHUB_USER_NAME: xyz-123321
  GITHUB_USER_EMAIL: 76104776+xyz-123321@users.noreply.github.com

jobs:
  build:
    name: update
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Update paper links
        run: python daily_arxiv.py --update_paper_links

      - name: Commit generated files
        run: |
          set -euo pipefail
          git config user.name "$GITHUB_USER_NAME"
          git config user.email "$GITHUB_USER_EMAIL"
          git add -- README.md \
            docs/cv-arxiv-daily.json \
            docs/cv-arxiv-daily-web.json \
            docs/index.md \
            docs/cv-arxiv-daily-wechat.json \
            docs/wechat.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Update robotics paper links"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
